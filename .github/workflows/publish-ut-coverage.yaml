name: Publish Unit Test Coverage
on:
  workflow_dispatch

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@rc
        with: 
          egress-policy: audit
      - uses: actions/checkout@v2
      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: "11"
          distribution: "adopt"
      - name: Build with Maven
        run: |
          cd engine
          mvn --no-transfer-progress --batch-mode test jacoco:report 
        env:
          COVERALLS_TOKEN: ${{ secrets.COVERALLS_TOKEN }}

  build-arm:
    permissions:
      contents: read
  
    runs-on: ubuntu-24.04-arm
  
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@rc
        with:
          egress-policy: audit
  
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Set up JDK 11 ARM64
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "11"
          architecture: aarch64
  
      - name: Verify Java architecture
        run: |
          uname -m
          echo "JAVA_HOME=$JAVA_HOME"
          which java
          java -version
          file "$JAVA_HOME/bin/java"
  
      - name: Build with Maven
        run: |
          cd engine
          mvn --no-transfer-progress --batch-mode test jacoco:report
        env:
          COVERALLS_TOKEN: ${{ secrets.COVERALLS_TOKEN }}
